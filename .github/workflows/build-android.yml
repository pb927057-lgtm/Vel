
name: VEL Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-vel/**'
      - 'vel2-con-compilacion-remota.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract VEL project
        run: unzip -q vel2-con-compilacion-remota.zip -d source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile and run Android unit tests
        run: gradle -p source/android-vel testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vel-debug-apk
          path: source/android-vel/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

